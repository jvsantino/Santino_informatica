<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS SANTINO INFORMÁTICA</title>
    <link rel="stylesheet" href="style.css">
   </head>
<body>
    <form action="" id="formulario">
    <h2>Santino Informática - Ordens de serviço</h2>
    <label for="nome">Nome</label>
    <input type="text" id="nome">
    <label for="endereco">Endereço</label>
    <input type="text" id="endereco">
    <label for="telefone">Telefone</label>
    <input type="tel" id="telefone">
    <label for="dispositivo">Dispositivo</label>
    <input type="text" id="dispositivo">
    <label for="data_de_entrada">Data de entrada</label>
    <input type="date" id="data_de_entrada">
    <label for="defeito">Defeito</label>
    <textarea id="defeito" rows="4"></textarea>
    <input type="submit" value="Prosseguir">
    </form>
    

    

    <script src="script.js"></script>
</body>
</html>
